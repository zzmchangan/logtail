# logtail 正式配置 —— RO3 服务器日志聚合(集群 131189)
#
# 三个服务通过 dx 工具自动发现日志文件路径, 无需手工维护具体文件名。
# 日志按天分文件, 由 dx 每次解析出当天最新路径; 工具轮询时会重新跑 dx,
# 跨天/轮转后自动跟到新文件。

log_sources:
  - name: SceneServer            # SceneServer 多实例 (dungeon-0 / main-0), 输出前缀统一为 scene
    dx: "dx log SceneServer 131189"

  - name: GuildServer            # GuildServer 单实例
    dx: "dx log GuildServer 131189"

  - name: MatchServer            # MatchServer 单实例
    dx: "dx log MatchServer 131189"

# 黑名单: 命中则丢弃该日志行(采集阶段应用)。
# 裸词 = 大小写不敏感子串匹配; "re:" 前缀 = 正则表达式(同样大小写不敏感)。
blacklist:
  - "heartbeat"
  - "keepalive"
  - "timer_tick"
  - "DEBUG"
  - "InspectUtils"

# 初始高亮词: 启动时作为关键词列表加载(运行时可用 /keyword 动态增删)。
# 仅当运行中输入 /save 才会把当前高亮词与黑名单写回本文件。
keywords:
  - "ERROR"
  - "timeout"
  - "Assert"

# 关联键: --correlate player=123 时按这些正则从每行抽取 id、归一化(去空白/前导零)
# 后跨源对齐。同一逻辑 id 在不同进程写法不同 (Guid: / roleId: / player=), 字面匹配
# 串不起来, 抽取+归一化后即可跨进程跟一条逻辑链路。
# 未定义的 key 回退字面子串 (同 --trace); --summary 的 correlate 自报
# lines_with_key 可判断正则是否写歪 / key 是否有区分度。
correlation_keys:
  - name: player
    extract:
      - "Guid[:=] *(\\d+)"          # [Player Guid:1276679028765 ...] (已实测可抽到)
      - "roleId[:=] *(\\d+)"
      - "player[:=] *(\\d+)"
  # 注意: s=xxx&c=xxx token 实测窗口内每行都有 (lines_with_key==lines_total),
  # 是全服常量、无区分度, 不作关联键; 若确认有请求级唯一 token 再加。
