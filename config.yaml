# logtail 正式配置 —— RO3 服务器日志聚合(集群 131189)
#
# 两种日志源模式:
#   dx 模式   : 用 `dx log <svc> <cluster>` 自动发现当天文件路径(按天分文件, 自动轮转)。
#               dx 模式不校验目录; 适用于游戏大服(scene/guild/match/auction/public/http/activity/scenemgr/relation)。
#   glob 模式 : 直接 `path` + `pattern` 匹配, 适用于 dx 抓不到的微服务日志(在 /ms/ 根, 非集群 131189 目录)。
#               glob 模式会校验 path 目录存在(目录不存在会报配置错误, 不含则删掉对应源)。
#   TeamServer/BarServer 的日志在 /data/vm-ro3-deploys/log/ms/(TeamService/BarService),
#   `dx log TeamServer 131189` 抓不到, 所以用 glob 直连。
#
# ⚠️ Agent 使用提示 (工作流铁律):
#   - 【先看代码, 再调 config】排查前先读代码, 初步确认涉及哪些服务器/关键字, 再打开对应源。
#     默认只开开发常用服 (scene/scenemgr/guild/match/team), 其余低频服注释、按需放开。
#   - 先跑 `--diagnose` 看每个源是否被发现(files/discovered/dx_error), 再信 "0 命中";
#   - 各源 source(name) 用作输出前缀与 --focus; 与 dx 服务名是两个东西, 别混淆;
#   - 支持功能/筛选/输出详见 `--help`(如 --focus/--correlate/--ctx-same/--json/--summary/--since)。

# 别名(name) -> 服务 对照:
#   scene=SceneServer(多实例 dungeon-0/main-0) / scenemgr=SceneMgrServer / guild=GuildServer
#   auction=AuctionServer / public=PublicServer / http=HttpServer / match=MatchServer
#   activity=ActivityServer / relation=RelationServer / team=TeamService(ms) / bar=BarService(ms)
log_sources:
  - name: scene
    dx: "dx log SceneServer 131189"

  - name: scenemgr
    dx: "dx log SceneMgrServer 131189"

  - name: guild
    dx: "dx log GuildServer 131189"

  # 低频调试服: 涉及对应 bug 时取消注释(遵循"先看代码确定涉及哪些服, 再开对应源")。
  # - name: auction
  #   dx: "dx log AuctionServer 131189"
  # - name: public
  #   dx: "dx log PublicServer 131189"
  # - name: http
  #   dx: "dx log HttpServer 131189"

  - name: match
    dx: "dx log MatchServer 131189"

  # - name: activity
  #   dx: "dx log ActivityServer 131189"
  # - name: relation
  #   dx: "dx log RelationServer 131189"

  # 微服务日志在 /data/vm-ro3-deploys/log/ms/(TeamService/BarService), dx 抓不到 -> 用 glob。
  # 多实例: team-service-{0,1}/team_service.log; glob 的 path 必须存在(配置会校验)。
  # ⚠️ 这些微服务日志几乎全为 [Debug] 级, 会被黑名单 "DEBUG"(大小写不敏感)滤掉,
  #    查它们时加 --blacklist-del DEBUG(或 --no-blacklist)临时放行, 否则 --focus team/bar 会显示为空(不是没日志)。
  - name: team
    path: /data/vm-ro3-deploys/log/ms/TeamService
    pattern: "team-service-*/team_service.log"

  # bar 暂不需要, 按需取消注释(同 team 一样是微服务, 去 DEBUG 黑名单查):
  # - name: bar
  #   path: /data/vm-ro3-deploys/log/ms/BarService
  #   pattern: "bar-service-*/bar_service.log"

  # SeasonServer 本集群无日志(全库未找到), 需要时按 glob 补一条, 例:
  # - name: season
  #   path: /data/vm-ro3-deploys/log/ms/SeasonService
  #   pattern: "season-service-*/season_service.log"
  # ms/ 下还有大量其他微服务(avatar/friend/mail/login/party/pay/push/queue/rank/trade*/uuid...),
  # 排查相关 bug 时按上面的 glob 模式按需加一两条即可。

# 黑名单: 命中则丢弃该日志行(采集阶段应用)。
# 裸词 = 大小写不敏感子串匹配; "re:" 前缀 = 正则表达式(同样大小写不敏感)。
blacklist:
  - "heartbeat"
  - "keepalive"
  - "timer_tick"
  - "DEBUG"
  - "InspectUtils"
  - "SceneMgrStats"        # SceneMgrServer CollectStatistics 周期状态汇总(Info级, 一天上千条); 详实的建线/AutoScaling 不受影响

# 初始高亮词: 启动时作为关键词列表加载(运行时可用 /keyword 动态增删)。
# 仅当运行中输入 /save 才会把当前高亮词与黑名单写回本文件。
keywords:
  - "ERROR"
  - "timeout"
  - "Assert"

# 关联键: --correlate player=123 时按这些正则从每行抽取 id、归一化(去空白/前导零)
# 后跨源对齐。同一逻辑 id 在不同进程写法不同 (Guid: / roleId: / player=), 字面匹配
# 串不起来, 抽取+归一化后即可跨进程跟一条逻辑链路。
# 未定义的 key 回退字面子串 (同 --trace); --summary 的 correlate 自报
# lines_with_key 可判断正则是否写歪 / key 是否有区分度。
correlation_keys:
  - name: player
    extract:
      - "Guid[:=] *(\\d+)"          # [Player Guid:1276679028765 ...] (已实测可抽到)
      - "roleId[:=] *(\\d+)"
      - "player[:=] *(\\d+)"
  # 注意: s=xxx&c=xxx token 实测窗口内每行都有 (lines_with_key==lines_total),
  # 是全服常量、无区分度, 不作关联键; 若确认有请求级唯一 token 再加。
  #
  # scene 已内置预设 (scene:/sceneId:/scene_id= 三种写法), 无需在此定义;
  # 实测是本集群最有区分度的跨服关联键 (跨 guild+scene+scenemgr),
  # 但其 id 多在 [Debug] 行 —— 追 scene 链路加 --blacklist-del debug 临时放行(或 --no-blacklist), 不必切配置。
  # 找新 key 先跑: logtail --discover-keys --config <cfg> --since 30m
  # (与 --correlate 同视野含黑名单, 报的数字就是 correlate 能看到的)。
