# logtail 微服务专用视野 —— 只含 ms 源(Team 等), 无 DEBUG 黑名单、无大服噪声
#
# ⚠️ 首选路线已变(2026-08-27 动态黑名单落地后):
#   查微服务/跨服联查用主 config + --blacklist-del DEBUG 一步到位, 不必切本文件:
#     logtail --agent --config config.yaml --blacklist-del debug --focus team --since 5m
#   登录/认证链路(clientgate/login)也常驻主 config 了(enabled: false):
#     logtail --agent --config config.yaml --enable-source login,clientgate --blacklist-del debug
#
# 本文件的剩余价值: 只看微服务、完全不要大服聚合流时用它(天然去噪)。
#   logtail --config /data/workspace/logtail/config.ms.yaml --agent --focus team --since 5m
#
# 按需加其它微服务(都在 /data/vm-ro3-deploys/log/ms/ 下, 加 enabled: false 可配
# --enable-source 按名拉起), 例:
#   avatar/friend/mail/party/pay/push/queue/rank/trade*/uuid..., 例:
#   - name: mail
#     path: /data/vm-ro3-deploys/log/ms/MailService
#     pattern: "mail-service-*/mail_service.log"

log_sources:
  - name: team
    path: /data/vm-ro3-deploys/log/ms/TeamService
    pattern: "team-service-*/team_service.log"

  # bar 暂不需要, 按需取消注释(同 team 都是微服务, 本配置无 DEBUG 黑名单可直接读):
  # - name: bar
  #   path: /data/vm-ro3-deploys/log/ms/BarService
  #   pattern: "bar-service-*/bar_service.log"

# 刻意不放 "DEBUG" —— 微服务日志几乎全为 [Debug] 级。
# (主配置放 DEBUG 是为了去大服噪声; 查大服 Debug 行用主配置 + --blacklist-del debug。)
blacklist:
  - "heartbeat"
  - "keepalive"
  - "timer_tick"
  - "InspectUtils"

keywords:
  - "ERROR"
  - "timeout"
  - "Assert"

# 关联键(同主配置): JSON 引号容错("RoleId":"123")与裸写法(Guid:/roleId:/player=)都认。
correlation_keys:
  - name: player
    extract:
      - '"?Guid"?[:=] *"?(\d+)'
      - '"?roleId"?[:=] *"?(\d+)'
      - '"?player"?[:=] *"?(\d+)'
